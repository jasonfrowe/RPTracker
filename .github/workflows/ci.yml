name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install py65

      - name: Install LLVM-MOS SDK
        run: |
          mkdir -p llvm-mos
          curl -sSL https://github.com/llvm-mos/llvm-mos-sdk/releases/download/v23.1.0/llvm-mos-linux.tar.xz | tar -xJ -C llvm-mos --strip-components=1
          echo "$(pwd)/llvm-mos/bin" >> $GITHUB_PATH

      - name: Import NSF Tracks to RPT Files
        run: |
          python3 tools/import_nsf.py NSF/Pac-Man_CE.nsf music

      - name: Fetch RP6502 Tools & Emulator
        run: |
          cmake -P tools/rp6502.cmake

      - name: Configure CMake
        run: |
          cmake -B build -DCMAKE_PREFIX_PATH=$(pwd)/llvm-mos -DLLVM_MOS_PLATFORM=rp6502 -DCMAKE_BUILD_TYPE=MinSizeRel

      - name: Build RPTracker
        run: |
          cmake --build build

      - name: Run Headless Emulator Verification Tests
        run: |
          chmod +x tools/rp6502-emu
          ./tools/rp6502-emu --mute --screenshot build/ci_test.png --frames 60 build/RPTracker.rp6502
          ./tools/rp6502-emu --mute --screenshot build/ci_pacman.png --frames 60 build/RPTracker.rp6502 -- music/PACMAN01.RPT
          printf 'run 30\ntype " "\nrun 60\nshot "build/ci_script.png"\n' | ./tools/rp6502-emu --mute --script - build/RPTracker.rp6502 -- music/PACMAN01.RPT
